<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>片段复核 · Apex Local Cut</title><link rel="stylesheet" href="design.css"></head><body><header><a href="../">Apex <span>Local Cut</span></a><span>交互设计稿</span></header><main><div class="heading"><h1>片段复核</h1><span>apex-combat-60s.mp4 · 01:00</span></div><section class="player" tabindex="-1"><video id="video" poster="poster.jpg" playsinline></video><div class="controls"><button id="play" disabled>播放</button><span id="clock">00:19.0 / 01:00</span><span id="scope">全片</span><button id="exit" hidden>退出区间编辑</button></div><div class="track-caption"><span>原片画面与声音</span><span>画面每 5 秒采样</span></div><div id="play-axis" class="axis" aria-label="播放与裁剪时间轴"><div id="filmstrip" class="filmstrip" aria-label="原片画面抽样"></div><canvas id="waveform" aria-label="原片默认音轨的音频峰值"></canvas><div id="range" hidden><button id="left" class="handle" aria-label="调整起点" role="slider" tabindex="0">〈</button><button id="right" class="handle" aria-label="调整终点" role="slider" tabindex="0">〉</button></div><button id="head" aria-label="播放位置" role="slider" tabindex="0"></button></div><div id="ticks" class="ticks"></div><div id="edit-info" class="edit-info"><span>拖动播放头浏览原片</span></div><div id="hover-preview" hidden><img id="hover-image" alt="附近采样画面"><span id="hover-time"></span></div></section><section class="predictions" tabindex="-1"><div class="heading"><h2>预测区间</h2><span id="prediction-summary"></span></div><div class="timeline-tools"><div><button id="delete" disabled>排除选中 · Del</button><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button></div><div><button id="zoom-out" aria-label="缩小预测时间轴">−</button><button id="zoom-in" aria-label="放大预测时间轴">＋</button><button id="fit-all">全片</button><button id="pan-left" aria-label="向前查看">←</button><button id="pan-right" aria-label="向后查看">→</button></div></div><div class="track-caption"><label><input id="show-excluded" type="checkbox"> 显示已排除</label></div><div class="track-caption"><span>预测区间</span><span id="pred-window"></span></div><div id="pred-axis" class="prediction-axis"></div><div id="pred-ticks" class="ticks"></div><p id="status" role="status">预测区间供复核参考，不代表击杀。</p></section><footer>示例区间 · 调整仅在本设计稿内生效 <button id="reset">重置示例</button></footer></main><script src="design.js"></script></body></html>
