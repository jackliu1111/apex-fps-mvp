<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导出工作区 · Apex Local Cut</title><link rel="stylesheet" href="style.css">
<header><div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 24 15 4h5L10 24Zm11 0 5-9 5 9Z" fill="currentColor"/></svg><strong>Apex <span>Local Cut</span></strong></div><nav aria-label="工作区"><span>分析队列</span><span>片段复核</span><b aria-current="page">导出工作区</b></nav><span class="prototype">交互设计稿 · 示例数据</span></header>
<main><div class="title"><div><h1>导出工作区</h1><p>把不同录像里的精彩瞬间，一起带走。</p></div><button id="demo">演示逐条进度</button></div>
<div class="tabs" role="tablist" aria-label="导出阶段"><button role="tab" id="pending-tab" aria-selected="true">待导出 <span id="pending-count"></span></button><button role="tab" id="tasks-tab" aria-selected="false">任务记录 <span id="task-count"></span></button></div>
<div class="mobile-actions"><button id="mobile-settings">输出设置 ↓</button><button id="mobile-submit" class="primary">提交所选片段</button></div><div class="layout"><section class="list-area" aria-label="片段清单"><div class="toolbar"><label><input type="checkbox" id="all" checked> 全选</label><span id="list-summary"></span><button id="remove" class="quiet">移除所选</button></div><div id="rows"></div><div class="list-foot"><span id="selection"></span><span>每条片段独立成片</span></div><p class="snapshot" id="snapshot">选片范围保留加入时的版本；需要调整时，在片段复核中重新加入。</p></section>
<aside><section class="settings"><div class="section-title"><h2>默认输出设置</h2><span id="saved">自动记住</span></div><p>用于下一次提交的片段</p><label class="field">格式<select id="format"><option value="mp4">MP4 · H.264</option><option value="webm">WebM · VP8</option></select></label><label class="field">分辨率<select id="resolution"><option value="source">跟随原片</option><option value="1080">最高 1080p</option><option value="720">最高 720p</option></select></label><label class="field">帧率<select id="fps"><option value="source">跟随原片</option><option value="60">最高 60 fps</option><option value="30">最高 30 fps</option></select></label><p class="help">保持原片比例，不放大画面、不提高帧率。每条片段的最终规格显示在列表中。</p><div class="destination"><h3>保存位置</h3><div class="destination-value"><span id="destination">浏览器下载</span><button class="quiet" id="folder">更改</button></div><p id="destination-note">完成后逐条下载，下载链接就绪不代表已保存。</p></div><div class="submit-summary"><span>本次提交</span><strong id="submit-summary"></strong></div><button class="primary" id="submit">提交导出</button></section><div class="background-note"><h3>导出时，继续选片</h3><p>可切换到分析或复核页面。请保持网页打开，关闭或刷新会中断当前导出。</p></div></aside></div>
<footer><span>Apex Local Cut · 本地选片</span><button class="quiet" id="reset">重置演示</button></footer></main>
<dialog id="dialog"><form method="dialog"><div class="section-title"><h2 id="dialog-title"></h2><button aria-label="关闭">×</button></div><p id="dialog-copy"></p><button class="primary">知道了</button></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></html>
