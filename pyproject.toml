[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-highlight"
version = "0.1.0"
description = "Local audio-model highlight analysis and review for Web and Electron"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
build = ["pyinstaller>=6.22,<7"]

[project.scripts]
apex-model-web = "model_web:main"
apex-model-ipc = "model_ipc:main"

[tool.setuptools]
packages = ["model_web_ui"]
py-modules = ["model_service", "model_inference", "model_web", "model_review", "model_identity", "model_runtime", "model_ipc"]

[tool.setuptools.package-data]
model_web_ui = ["*.html", "*.js", "*.css"]
