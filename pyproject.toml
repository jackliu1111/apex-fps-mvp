[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-highlight"
version = "0.1.0"
description = "Audio and damage-based gameplay highlight terminal wizard"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3", "typer>=0.16,<1", "questionary>=2,<3", "rich>=14,<16"]

[project.optional-dependencies]
build = ["pyinstaller>=6.22,<7"]
test = ["pexpect>=4.9,<5"]

[project.scripts]
apex-highlight = "highlight_cli:main"

[tool.setuptools]
py-modules = ["apex_highlight", "highlight_service", "highlight_cli", "terminal_ui", "media_runtime", "audio_chart", "damage_detector", "damage_templates", "precise_render"]
