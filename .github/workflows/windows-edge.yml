name: Windows Edge regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  regression:
    name: Windows Edge / ${{ matrix.check }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Import and model
            scenarios: import-button
          - check: Player ownership and navigation
            scenarios: stale-media-load navigation-frames
          - check: Trim and directory save
            scenarios: trim-refresh-export directory-export
          - check: Real recording directory export
            scenarios: real-recording-export
    env:
      PYTHONUTF8: '1'
      PLAYWRIGHT_MODULE: playwright-core
      REVIEW_URL: http://127.0.0.1:8793
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Run media scenarios in installed Edge
        shell: pwsh
        run: |
          $edge = Get-Item "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe" -ErrorAction Stop
          $env:CHROME_EXECUTABLE = $edge.FullName
          Write-Host "Tested commit $(git rev-parse HEAD), PR head ${{ github.event.pull_request.head.sha }}, Edge $($edge.VersionInfo.ProductVersion)"
          Get-FileHash model_web_ui/browser.prototype/tests/synthetic-media.mjs,site/assets/efficientsed/fmn10-tf256.onnx | Format-List
          $server = Start-Process python -ArgumentList '-u','model_web_ui/browser.prototype/serve.py','--port','8793' -PassThru -NoNewWindow
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              if ($server.HasExited) { throw "Static server stopped with $($server.ExitCode)" }
              try {
                $response = Invoke-WebRequest "$env:REVIEW_URL/assets/efficientsed/model.json" -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (!$ready) { throw "Static service did not serve model manifest at $env:REVIEW_URL" }
            foreach ($scenario in '${{ matrix.scenarios }}'.Split(' ')) {
              Write-Host "Running $scenario"
              $arguments = @()
              if ($scenario -eq 'real-recording-export') {
                $fixtures = 'tests/fixtures/recordings-v1'
                $hashes = Get-Content "$fixtures/SHA256SUMS" -ErrorAction Stop
                if ($hashes.Count -ne 3) { throw "Expected three v1 recording hashes" }
                foreach ($name in 'A.mp4','B.mp4','C.mp4') {
                  $digest = (Get-FileHash "$fixtures/$name" -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
                  if ("$digest  $name" -cnotin $hashes) { throw "Fixture digest mismatch for $name" }
                  Write-Host "recordings-v1 $name $digest"
                }
                Write-Host "B.mp4 = paused review, C.mp4 = live covered, A.mp4 = D offline"
                $arguments = @($fixtures, '--watch')
              }
              node "model_web_ui/browser.prototype/tests/verify-$scenario.cjs" @arguments
              if ($LASTEXITCODE -ne 0) { throw "$scenario failed with exit code $LASTEXITCODE" }
            }
          } finally {
            if (!$server.HasExited) { Stop-Process -Id $server.Id }
          }
